<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizzaria 🍕</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>Pizzaria 🍕</header>

<main>

  <section class="form-section">
    <h2>Fazer Pedido</h2>

    <input type="text" id="cliente" placeholder="Nome do cliente">

    <input type="email" id="email" placeholder="Email do cliente">

    <select id="sabor">
      <option value="">Selecione um sabor</option>
      <option value="Calabresa">Calabresa</option> 
      <option value="Mussarela">Mussarela</option> 
      <option value="Frango com Catupiry">Frango com Catupiry</option> 
      <option value="Portuguesa">Portuguesa</option> 
      <option value="Quatro Queijos">Quatro Queijos</option> 
    </select>

    <input type="number" id="preco" placeholder="Preço">

    <button onclick="adicionarPedido()">Adicionar Pedido</button>
  </section>

  <section class="lista-section">
    <h2>Pedidos</h2>
    <ul id="listaPedidos"></ul>

    <h3 id="totalPedidos">Total: R$ 0.00</h3>
  </section>

</main>

<script src="script.js"></script>

</body>
</html>
